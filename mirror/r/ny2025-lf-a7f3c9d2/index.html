<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080000;color:#fafaf8;font-family:'Inter',system-ui,sans-serif;

.w{width:100%;max-width:380px;text-align:center}
.m{font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;letter-spacing:.04em;

p{color:#8c8c88;font-size:14px;margin-bottom:24px}

  text-align:center;outline:none;transition:border-color .2s}

button{width:100%;margin-top:12px;background:#fafaf8;color:#080000;border:none;

  border-radius:12px;cursor:pointer;transition:background .2s}
button:hover{background:#93c01f}
button:disabled{opacity:.5;cursor:default}
.n{margin-top:22px;font-size:12px;color:#4a4a47;line-height:1.5}

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// учёт заходов: open — страницу открыли, unlock — ввели верный пароль.
// Идентификатор визита кладём в sessionStorage: он переживает разбор
// расшифрованной страницы, поэтому все события склеиваются в один визит.
function sid(){
  try{
    let s=sessionStorage.getItem('hm_sid');
    if(!s){ s=Math.random().toString(36).slice(2)+Date.now().toString(36);
            sessionStorage.setItem('hm_sid',s); }
    return s;
  }catch(_){ return 'nostore'; }
}
function hit(e){
  try{
    const u='hit.php?e='+e+'&sid='+encodeURIComponent(sid());
    if(navigator.sendBeacon) navigator.sendBeacon(u);
    else fetch(u,{method:'POST',keepalive:true}).catch(()=>{});
  }catch(_){}
}
hit('open');
async function open_(){
  const el=document.getElementById('p'),btn=document.getElementById('b');
  const pw=el.value; if(!pw)return;
  btn.disabled=true; btn.textContent='Расшифровка...';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:d(S),iterations:IT,hash:'SHA-256'},km,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(N)},key,d(C));
    const html=new TextDecoder().decode(buf);
    hit('unlock');
    document.open();document.write(html);document.close();
  }catch(e){
    btn.disabled=false; btn.textContent='Открыть';
    el.classList.add('err'); el.value=''; setTimeout(()=>el.classList.remove('err'),400);
  }
}
document.getElementById('b').onclick=open_;
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')open_();});
</script>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#080000;color:#fafaf8;font-family:'Inter',system-ui,sans-serif;

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// учёт заходов: open — страницу открыли, unlock — ввели верный пароль
function hit(e){
  try{
    const u='hit.php?e='+e;
    if(navigator.sendBeacon) navigator.sendBeacon(u);
    else fetch(u,{method:'POST',keepalive:true}).catch(()=>{});
  }catch(_){}
}
hit('open');
async function open_(){
  const el=document.getElementById('p'),btn=document.getElementById('b');
  const pw=el.value; if(!pw)return;
  btn.disabled=true; btn.textContent='Расшифровка...';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:d(S),iterations:IT,hash:'SHA-256'},km,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(N)},key,d(C));
    const html=new TextDecoder().decode(buf);
    hit('unlock');
    document.open();document.write(html);document.close();
  }catch(e){
    btn.disabled=false; btn.textContent='Открыть';
    el.classList.add('err'); el.value=''; setTimeout(()=>el.classList.remove('err'),400);
  }
}
document.getElementById('b').onclick=open_;
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')open_();});
</script>
